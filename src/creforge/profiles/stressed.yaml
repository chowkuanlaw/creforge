# creforge built-in profile: stressed
# Baseline population and products under a recession-shaped macro path: roll rates
# ramp up from month 9, peak at 1.8x around month 15, and ease back to 1.2x by
# month 33. ILLUSTRATIVE ONLY. See baseline.yaml.
extends: baseline
name: stressed
description: >
  Baseline population under a recession-shaped macro stress path.
macro:
  points: [[0, 1.0], [9, 1.0], [15, 1.8], [24, 1.6], [33, 1.2]]

# Stress bands: lower bound as baseline; upper bound at the 2008 to 2011 peak of the
# same Federal Reserve series (cards 30+ 6.77%, charge-off 10.54%; mortgages 30+ 11.48%,
# charge-off 2.80%; other consumer 30+ 3.66%, charge-off 3.36%), rounded up, with the
# same non-bank allowance for auto and personal loans as the baseline.
targets:
  credit_card:   {dpd30_share: [0.015, 0.070], annual_writeoff_rate: [0.015, 0.110]}
  mortgage:      {dpd30_share: [0.012, 0.120], annual_writeoff_rate: [0.000, 0.030]}
  personal_loan: {dpd30_share: [0.012, 0.060], annual_writeoff_rate: [0.003, 0.060]}
  auto_loan:     {dpd30_share: [0.012, 0.060], annual_writeoff_rate: [0.003, 0.060]}
  overdraft:     {dpd30_share: [0.010, 0.070], annual_writeoff_rate: [0.010, 0.110]}
  bnpl:          {dpd30_share: [0.030, 0.200], annual_writeoff_rate: [0.003, 0.060]}
