[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "creforge"
version = "0.7.0"
description = "PII-safe synthetic credit bureau data from explicit behavioural rules."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "creforge contributors" }]
keywords = ["synthetic-data", "credit-risk", "credit-bureau", "test-data", "privacy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "numpy>=1.26",
  "polars>=1.0",
  "pyarrow>=14",
  "pydantic>=2.5",
  "pyyaml>=6.0.1",
  "click>=8.1",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.5", "duckdb>=1.0"]
examples = ["matplotlib>=3.7", "jupyter"]

[project.scripts]
creforge = "creforge.cli:main"

[project.urls]
Homepage = "https://github.com/chowkuanlaw/creforge"
Documentation = "https://github.com/chowkuanlaw/creforge/tree/main/docs"
Changelog = "https://github.com/chowkuanlaw/creforge/blob/main/CHANGELOG.md"
Issues = "https://github.com/chowkuanlaw/creforge/issues"
Source = "https://github.com/chowkuanlaw/creforge"

[tool.hatch.build.targets.wheel]
packages = ["src/creforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: statistical tests on larger populations"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
