name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -m "not slow"

  calibration-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=creforge --cov-report=term-missing --cov-fail-under=95

  min-deps:
    # Install the oldest dependency versions pyproject.toml allows, and run everything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" -c ci/min-constraints.txt
      - run: python -c "import numpy, polars, pyarrow; print(numpy.__version__, polars.__version__, pyarrow.__version__)"
      - run: python -m pytest

  postgres:
    # Runs the generated Postgres DDL (with constraints) and \copy script against a real server.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CREFORGE_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: psql --version
      - run: python -m pytest tests/test_ddl.py -k postgres -rs
