name: Release

# Publishes to PyPI with trusted publishing (OIDC): no API token is stored anywhere.
#
# Three ways to release (see RELEASING.md); all are safe to combine:
#   - Actions tab -> Release -> Run workflow on main, entering the version (creates the tag),
#   - push a version tag:  git tag v1.2.3 && git push origin v1.2.3, or
#   - publish a release in the GitHub web UI.
# Each creates the GitHub release page from CHANGELOG.md if it doesn't exist yet.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must match pyproject.toml)"
        required: true
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then tag="${INPUT_VERSION#v}"; else tag="${GITHUB_REF_NAME#v}"; fi
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A tag push and a web-UI release can both fire for the same version.
          skip-existing: true

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub release from CHANGELOG.md (if it doesn't exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          # The CHANGELOG section for this version, without its heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "Install: \`pip install creforge==$VERSION\`" >> notes.md
          # Creates the tag on this commit if it doesn't exist (manual runs); reuses it otherwise.
          gh release create "$tag" --title "creforge $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
