# Only GitHub Actions are updated automatically. Python dependencies are deliberately
# not: pyproject.toml declares open ranges (">=") that need no bumping, and
# ci/min-constraints.txt must stay pinned to the OLDEST supported versions. That is the
# point of the min-deps CI job, so Dependabot must never "upgrade" it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
